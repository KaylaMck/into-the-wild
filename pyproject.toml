[project]
name = "into-the-wild"
version = "0.1.0"
description = "National park safety and crime analysis pipeline"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # Orchestration
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "dagster-dbt>=0.23.0",

    # Ingestion
    "polars>=0.20.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",

    # Storage
    "duckdb>=0.10.0",

    # Transformation
    "dbt-duckdb>=1.8.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "pyarrow>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["into_the_wild"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["into_the_wild"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"